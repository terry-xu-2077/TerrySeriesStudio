<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TerrySeriesStudio · 沉浸式共写 Demo</title>
  <meta name="description" content="剧本沉浸式写作 + AI 共写对话 Demo，纯前端模拟，无需后端">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="shell" id="shell">

    <header class="bar" id="topbar">
      <div class="bar-left">
        <div class="mark" aria-hidden="true"><span class="mark-letter">T</span></div>
        <div class="brand-word">Terry<strong>Series</strong></div>
        <div class="bar-divider" aria-hidden="true"></div>
        <div class="crumb">
          <span class="crumb-muted">异星边境</span>
          <span class="crumb-sep">·</span>
          <span>EP01 第一集</span>
          <span class="crumb-sep">·</span>
          <span class="crumb-muted">剧本</span>
        </div>
      </div>
      <div class="bar-center">
        <span class="save-indicator" id="saveIndicator"><span class="save-dot"></span><span id="saveText">已自动保存</span></span>
        <span class="rev-indicator" id="revIndicator">定稿修订 r1</span>
      </div>
      <div class="bar-right">
        <span class="demo-tag">DEMO</span>
        <span class="bar-btn" id="wordCountBtn" title="字数统计">
          <span id="wordCount">0</span> 字
        </span>
        <button type="button" class="icon-btn" id="resetDemo" title="清除本地演示内容并恢复示例" aria-label="重置示例">
          <svg class="i-svg" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.36M21 12a9 9 0 0 1-15.5 6.36"/><path d="M3 4v5h5"/><path d="M21 20v-5h-5"/></svg>
        </button>
        <button type="button" class="bar-btn" id="toggleChat" aria-pressed="true" title="收起/展开 AI 共写面板">
          <svg class="i-svg bar-btn-icon" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H10l-4.2 3.4a.6.6 0 0 1-1-.47V16h-.3A2.5 2.5 0 0 1 2 13.5v0"/></svg>
          <span id="toggleChatLabel">共写面板</span>
        </button>
        <button type="button" class="approve-btn" id="approveBtn" title="批准当前版本，作为可交付定稿">
          <svg class="i-svg approve-icon" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
          <span id="approveLabel">批准本稿</span>
        </button>
      </div>
    </header>

    <div class="layout" id="layout">

      <div class="canvas-scroll" id="canvasScroll">
        <div class="canvas-inner">
          <div class="doc-head">
            <div class="doc-kicker">EPISODE 01 · SCREENPLAY</div>
            <h1 id="docTitle">第一集 · 回收日</h1>
            <p class="doc-hint">沉浸式写作：选中一段文字和 AI 讨论怎么改；写到末尾停顿，AI 会在后面给出灰色续写建议，按 Tab 采纳。</p>
          </div>
          <div class="gutter-and-doc">
            <div class="gutter" id="gutter" aria-hidden="true"></div>
            <div class="doc" id="doc"></div>
          </div>
          <div class="doc-foot"><span>— END —</span></div>
        </div>
      </div>

      <aside class="chat" id="chatPanel" aria-label="AI 共写面板">
        <div class="chat-head">
          <div class="chat-title"><span class="chat-title-dot" aria-hidden="true"></span>与 AI 共写</div>
          <button type="button" class="icon-btn icon-btn-ghost" id="collapseChat" aria-label="收起共写面板" title="收起">
            <svg class="i-svg" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div class="chat-threads" id="chatThreads"></div>
        <div class="chat-composer">
          <div class="composer-ref" id="composerRef" hidden>
            <div class="composer-ref-label">引用选中内容 <button type="button" id="clearRef" aria-label="取消引用"><svg class="i-svg" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
            <div class="composer-ref-quote" id="composerRefQuote"></div>
          </div>
          <textarea id="chatInput" rows="2" placeholder="随便聊聊这段剧本——人物动机、节奏、要不要改这句……"></textarea>
          <div class="composer-row">
            <button type="button" class="composer-link" id="switchGeneral" hidden>↩ 不针对这段，随便聊</button>
            <span class="composer-hint" id="composerHint">Enter 发送 · Shift+Enter 换行</span>
            <button type="button" class="send-btn" id="sendBtn" aria-label="发送">
              <svg class="i-svg" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </aside>

      <button type="button" class="chat-reopen" id="reopenChat" hidden title="展开共写面板">
        <svg class="i-svg" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H10l-4.2 3.4a.6.6 0 0 1-1-.47V16h-.3A2.5 2.5 0 0 1 2 13.5v0"/></svg>
      </button>
    </div>
  </div>

  <div id="selectBubble" class="select-bubble" hidden>
    <button type="button" id="askAiBtn">
      <span class="select-bubble-icon"><svg class="i-svg" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7A2.5 2.5 0 0 1 17.5 16H10l-4.2 3.4a.6.6 0 0 1-1-.47V16h-.3A2.5 2.5 0 0 1 2 13.5v0"/></svg></span>
      跟 AI 聊这段
    </button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
